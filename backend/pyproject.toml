[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefuse"
version = "0.1.0"
description = "TRACEFUSE — The Intelligence Fusion Lab: blockchain forensics + OSINT evidence fusion backend"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "networkx>=3.3",
  "numpy>=2.1",
  "scipy>=1.14",
  "pycryptodome>=3.20",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["tracefuse*"]

[tool.setuptools.package-data]
tracefuse = ["storage/migrations/*.sql", "intel/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: performs real network calls against public providers (opt-in via TRACEFUSE_LIVE_TESTS=1)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are fine in tests
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in docs/strings is intentional
  "B008",   # FastAPI Depends/Query defaults
  "E501",   # long lines: readability over wrapping for dense data literals
  "S105", "S106", "S107",  # false positives on token_type (ERC token kind), not credentials
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
